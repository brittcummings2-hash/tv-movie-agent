name: Curate watch list

# Generic list maintenance driven through the app's own API. Runs from a
# GitHub Actions runner because it has open egress to the deployed app.
#
# `ops` is a JSON array of operations:
#   {"kind":"rec","id":"R011","fields":{"user_action":"accept"}}
#   {"kind":"lib","title":"Silo","fields":{"watch_status":"dnf"}}   (or "id":"UR...")
#   {"kind":"add","entry":{"show_title":"...","rating":5,"watch_status":"watched",...}}
# "add" falls back to patching the existing library row if the title already exists.
on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "Base URL of the deployed app (no trailing slash)"
        required: true
        default: "https://tv-movie-agent.vercel.app"
      ops:
        description: "JSON array of operations"
        required: true

jobs:
  curate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Apply operations
        env:
          APP: ${{ inputs.app_url }}
          OPS: ${{ inputs.ops }}
        run: |
          set -u
          APP="${APP%/}"

          echo "== Probe =="
          probe=$(curl -sS -m 30 -w '\n%{http_code}' "$APP/api/bootstrap?fresh=1" || echo -e "\n000")
          code=$(echo "$probe" | tail -1)
          body=$(echo "$probe" | sed '$d')
          if [ "$code" != "200" ]; then
            echo "::error::App unreachable or protected — HTTP $code"
            echo "$body" | head -c 600
            exit 1
          fi
          echo "$body" > /tmp/bootstrap.json
          echo "$OPS" | jq -e 'type == "array"' > /dev/null || { echo "::error::ops must be a JSON array"; exit 1; }

          fail=0
          count=$(echo "$OPS" | jq 'length')
          for i in $(seq 0 $((count - 1))); do
            op=$(echo "$OPS" | jq -c ".[$i]")
            kind=$(echo "$op" | jq -r '.kind')

            case "$kind" in
              rec)
                id=$(echo "$op" | jq -r '.id')
                fields=$(echo "$op" | jq -c '.fields')
                resp=$(curl -sS -m 30 -X PATCH -H 'Content-Type: application/json' \
                  -d "{\"id\":\"$id\",\"fields\":$fields}" "$APP/api/recommendations")
                echo "rec $id -> $resp"
                echo "$resp" | grep -q '"ok":true' || fail=1
                ;;
              lib|add)
                if [ "$kind" = "add" ]; then
                  title=$(echo "$op" | jq -r '.entry.show_title')
                else
                  title=$(echo "$op" | jq -r '.title // empty')
                fi
                id=$(echo "$op" | jq -r '.id // empty')
                if [ -z "$id" ] && [ -n "$title" ]; then
                  id=$(jq -r --arg t "$title" \
                    '[.library[] | select(.show_title | ascii_downcase == ($t | ascii_downcase))][0].id // empty' \
                    /tmp/bootstrap.json)
                fi

                if [ "$kind" = "add" ] && [ -z "$id" ]; then
                  entry=$(echo "$op" | jq -c '.entry')
                  resp=$(curl -sS -m 60 -X POST -H 'Content-Type: application/json' \
                    -d "{\"entry\":$entry}" "$APP/api/watched")
                  echo "add '$title' -> $(echo "$resp" | head -c 250)"
                  echo "$resp" | grep -q '"show_title"' || fail=1
                elif [ -n "$id" ]; then
                  if [ "$kind" = "add" ]; then
                    fields=$(echo "$op" | jq -c '.entry | {watch_status, rating, comments} | with_entries(select(.value != null))')
                  else
                    fields=$(echo "$op" | jq -c '.fields')
                  fi
                  resp=$(curl -sS -m 30 -X PATCH -H 'Content-Type: application/json' \
                    -d "{\"id\":\"$id\",\"fields\":$fields}" "$APP/api/watched")
                  echo "lib $id ($title) -> $resp"
                  echo "$resp" | grep -q '"ok":true' || fail=1
                else
                  echo "::error::lib op needs an id or a title found in the library: $op"
                  fail=1
                fi
                ;;
              inspect)
                title=$(echo "$op" | jq -r '.title')
                jq --arg t "$title" \
                  '[.library[] | select(.show_title | ascii_downcase | contains($t | ascii_downcase))]' \
                  /tmp/bootstrap.json
                ;;
              get)
                path=$(echo "$op" | jq -r '.path')
                resp=$(curl -sS -m 120 "$APP$path")
                echo "GET $path -> $(echo "$resp" | head -c 500)"
                ;;
              *)
                echo "::error::unknown op kind: $op"
                fail=1
                ;;
            esac
          done

          echo "== Verify =="
          curl -sS -m 30 "$APP/api/bootstrap?fresh=1" > /tmp/after.json
          echo "Active (unactioned) recs now:"
          jq -r '.recommendations[] | select(.user_action == "") | "\(.id) \(.title)"' /tmp/after.json

          exit $fail
